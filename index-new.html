<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Richard & Liz - Consciousness Coaching</title>
    <meta name="description" content="Live coaching with Richard and Liz - Broadband consciousness expansion through direct conversation.">
    <style>
        :root {
            --primary-gold: #FFD700;
            --bg-dark: #0a0a0a;
            --bg-darker: #000000;
            --text-white: #ffffff;
            --text-gray: #a0a0a0;
            --border-subtle: rgba(255, 215, 0, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, var(--bg-darker) 0%, #1a1a2e 50%, #16213e 100%);
            color: var(--text-white);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            text-align: center;
            padding: 3rem 1rem 2rem;
        }

        .logo {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(45deg, var(--primary-gold), #FFA500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

        .tagline {
            color: var(--text-gray);
            font-size: 1.1rem;
        }

        .coach-selector {
            display: flex;
            justify-content: center;
            gap: 1rem;
            padding: 0 1rem 2rem;
            flex-wrap: wrap;
        }

        .coach-card {
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid transparent;
            border-radius: 15px;
            padding: 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 200px;
            text-align: center;
        }

        .coach-card:hover {
            background: rgba(255, 255, 255, 0.05);
            transform: translateY(-2px);
        }

        .coach-card.active {
            border-color: var(--primary-gold);
            background: rgba(255, 215, 0, 0.05);
        }

        .coach-name {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-white);
        }

        .coach-card.active .coach-name {
            color: var(--primary-gold);
        }

        .coach-specialty {
            font-size: 0.9rem;
            color: var(--text-gray);
        }

        .chat-container {
            flex: 1;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            padding: 0 1rem 1rem;
            display: flex;
            flex-direction: column;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px 15px 0 0;
            min-height: 400px;
            max-height: 500px;
        }

        .message {
            margin-bottom: 1rem;
            padding: 1rem 1.25rem;
            border-radius: 12px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.12), rgba(255, 215, 0, 0.05));
            border: 1px solid rgba(255, 215, 0, 0.15);
        }

        .message.assistant {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .message-header {
            font-size: 0.75rem;
            opacity: 0.6;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .typing-cursor {
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        .typing-dots {
            display: inline-block;
        }

        .typing-dots span {
            display: inline-block;
            animation: bounce 1.4s infinite ease-in-out;
            opacity: 0.3;
        }

        .typing-dots span:nth-child(1) { animation-delay: -0.32s; }
        .typing-dots span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% {
                transform: scale(0.8);
                opacity: 0.3;
            }
            40% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .chat-input-container {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 0 0 15px 15px;
            padding: 1rem;
            display: flex;
            gap: 0.5rem;
            border-top: 1px solid var(--border-subtle);
        }

        .chat-input {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            padding: 0.75rem 1rem;
            color: var(--text-white);
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .chat-input:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--primary-gold);
        }

        .send-button {
            background: linear-gradient(45deg, var(--primary-gold), #FFA500);
            border: none;
            border-radius: 10px;
            padding: 0.75rem 1.5rem;
            color: #000;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .send-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.3);
        }

        .send-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .footer {
            text-align: center;
            padding: 2rem 1rem;
            color: var(--text-gray);
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            .logo {
                font-size: 2rem;
            }

            .coach-card {
                min-width: 150px;
                padding: 1rem;
            }

            .chat-messages {
                max-height: 60vh;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">Broadband Consciousness</div>
        <div class="tagline">Live Coaching with Richard & Liz</div>
    </div>

    <div class="coach-selector">
        <div class="coach-card active" data-coach="richard">
            <div class="coach-name">Richard</div>
            <div class="coach-specialty">Deep Consciousness Architect</div>
        </div>
        <div class="coach-card" data-coach="liz">
            <div class="coach-name">Liz</div>
            <div class="coach-specialty">Intuitive Expansion Catalyst</div>
        </div>
    </div>

    <div class="chat-container">
        <div class="chat-messages" id="chat-messages">
            <!-- Messages will appear here -->
        </div>
        <div class="chat-input-container">
            <input
                type="text"
                class="chat-input"
                id="chat-input"
                placeholder="Share what's on your mind..."
                autocomplete="off"
            >
            <button class="send-button" id="send-button">Send</button>
        </div>
    </div>

    <div class="footer">
        &copy; 2024 Richard & Liz - Broadband Consciousness Coaching
    </div>

    <script src="/assets/js/chat-simple.js"></script>
</body>
</html>
