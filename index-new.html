<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Richard & Liz - Consciousness Coaching</title>
    <meta name="description" content="Live coaching with Richard and Liz - Broadband consciousness expansion through direct conversation.">
    <style>
        :root {
            --primary-orange: #FF6B35;
            --primary-red: #E63946;
            --accent-gold: #FFB627;
            --bg-dark: #0a0a0a;
            --bg-darker: #000000;
            --text-white: #ffffff;
            --text-gray: #a0a0a0;
            --border-subtle: rgba(255, 107, 53, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a0e0a 30%, #2a1810 60%, #0a0a0a 100%);
            background-size: 400% 400%;
            animation: gradientFlow 20s ease infinite;
            color: var(--text-white);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-x: hidden;
        }

        @keyframes gradientFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .header {
            text-align: center;
            padding: 3rem 1rem 2rem;
            position: relative;
        }

        .logo {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(120deg, var(--primary-orange), var(--primary-red), var(--accent-gold));
            background-size: 200% 200%;
            animation: shimmer 4s ease infinite;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1rem;
        }

        @keyframes shimmer {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .tagline {
            color: var(--text-gray);
            font-size: 1.1rem;
            margin-bottom: 1.5rem;
        }

        .inspiration-quote {
            font-size: 1.3rem;
            font-weight: 300;
            font-style: italic;
            color: var(--primary-orange);
            margin: 1.5rem auto;
            max-width: 600px;
            padding: 0 1rem;
            opacity: 0;
            animation: fadeInOut 12s ease-in-out infinite;
            min-height: 60px;
        }

        @keyframes fadeInOut {
            0%, 100% { opacity: 0; transform: translateY(10px); }
            10%, 90% { opacity: 1; transform: translateY(0); }
        }

        .choice-particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 300px;
            pointer-events: none;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: radial-gradient(circle, var(--primary-orange), transparent);
            border-radius: 50%;
            opacity: 0;
            animation: rise 8s ease-in infinite;
        }

        .particle:nth-child(1) { left: 10%; animation-delay: 0s; }
        .particle:nth-child(2) { left: 25%; animation-delay: 2s; }
        .particle:nth-child(3) { left: 40%; animation-delay: 4s; }
        .particle:nth-child(4) { left: 60%; animation-delay: 1s; }
        .particle:nth-child(5) { left: 75%; animation-delay: 3s; }
        .particle:nth-child(6) { left: 90%; animation-delay: 5s; }

        @keyframes rise {
            0% {
                bottom: 0;
                opacity: 0;
                transform: scale(0.5);
            }
            50% {
                opacity: 0.6;
                transform: scale(1);
            }
            100% {
                bottom: 300px;
                opacity: 0;
                transform: scale(0.5);
            }
        }

        .coach-selector {
            display: flex;
            justify-content: center;
            gap: 1rem;
            padding: 0 1rem 2rem;
            flex-wrap: wrap;
        }

        .coach-card {
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid transparent;
            border-radius: 15px;
            padding: 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 200px;
            text-align: center;
        }

        .coach-card:hover {
            background: rgba(255, 255, 255, 0.05);
            transform: translateY(-2px);
        }

        .coach-card.active {
            border-color: var(--primary-orange);
            background: linear-gradient(135deg, rgba(255, 107, 53, 0.08), rgba(230, 57, 70, 0.05));
        }

        .coach-name {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-white);
        }

        .coach-card.active .coach-name {
            color: var(--primary-orange);
        }

        .coach-specialty {
            font-size: 0.9rem;
            color: var(--text-gray);
        }

        .chat-container {
            flex: 1;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            padding: 0 1rem 1rem;
            display: flex;
            flex-direction: column;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px 15px 0 0;
            min-height: 400px;
            max-height: 500px;
        }

        .message {
            margin-bottom: 1rem;
            padding: 1rem 1.25rem;
            border-radius: 12px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            background: linear-gradient(135deg, rgba(255, 107, 53, 0.12), rgba(230, 57, 70, 0.05));
            border: 1px solid rgba(255, 107, 53, 0.2);
        }

        .message.assistant {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .message-header {
            font-size: 0.75rem;
            opacity: 0.6;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .typing-cursor {
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        .typing-dots {
            display: inline-block;
        }

        .typing-dots span {
            display: inline-block;
            animation: bounce 1.4s infinite ease-in-out;
            opacity: 0.3;
        }

        .typing-dots span:nth-child(1) { animation-delay: -0.32s; }
        .typing-dots span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% {
                transform: scale(0.8);
                opacity: 0.3;
            }
            40% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .chat-input-container {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 0 0 15px 15px;
            padding: 1rem;
            display: flex;
            gap: 0.5rem;
            border-top: 1px solid var(--border-subtle);
        }

        .chat-input {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            padding: 0.75rem 1rem;
            color: var(--text-white);
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .chat-input:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--primary-orange);
        }

        .send-button {
            background: linear-gradient(120deg, var(--primary-orange), var(--primary-red));
            border: none;
            border-radius: 10px;
            padding: 0.75rem 1.5rem;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 2px 10px rgba(255, 107, 53, 0.3);
        }

        .send-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255, 107, 53, 0.5);
            background: linear-gradient(120deg, var(--primary-red), var(--accent-gold));
        }

        .send-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .footer {
            text-align: center;
            padding: 2rem 1rem;
            color: var(--text-gray);
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            .logo {
                font-size: 2rem;
            }

            .coach-card {
                min-width: 150px;
                padding: 1rem;
            }

            .chat-messages {
                max-height: 60vh;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="choice-particles">
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
        </div>
        <div class="logo">Broadband Consciousness</div>
        <div class="tagline">Live Coaching with Richard & Liz</div>
        <div class="inspiration-quote" id="inspiration-quote">
            Every choice expands your consciousness
        </div>
    </div>

    <div class="coach-selector">
        <div class="coach-card active" data-coach="richard">
            <div class="coach-name">Richard</div>
            <div class="coach-specialty">Deep Consciousness Architect</div>
        </div>
        <div class="coach-card" data-coach="liz">
            <div class="coach-name">Liz</div>
            <div class="coach-specialty">Intuitive Expansion Catalyst</div>
        </div>
    </div>

    <div class="chat-container">
        <div class="chat-messages" id="chat-messages">
            <!-- Messages will appear here -->
        </div>
        <div class="chat-input-container">
            <input
                type="text"
                class="chat-input"
                id="chat-input"
                placeholder="Share what's on your mind..."
                autocomplete="off"
            >
            <button class="send-button" id="send-button">Send</button>
        </div>
    </div>

    <div class="footer">
        &copy; 2024 Richard & Liz - Broadband Consciousness Coaching
    </div>

    <script src="/assets/js/chat-simple.js"></script>
    <script>
        // Inspirational quotes about choosing - from the Minister for Inspiration
        const inspirationQuotes = [
            "Every choice expands your consciousness",
            "You are always choosing... even when you think you're not",
            "The power to choose is the power to transform",
            "In every moment, infinite possibilities await your choice",
            "Choose consciously, expand infinitely",
            "Your choices create your reality",
            "What if every choice was an act of creation?",
            "Between stimulus and response lies the power of choice",
            "Choose awareness. Choose expansion. Choose you.",
            "The art of living is the art of conscious choosing"
        ];

        let quoteIndex = 0;
        const quoteElement = document.getElementById('inspiration-quote');

        function rotateQuotes() {
            quoteIndex = (quoteIndex + 1) % inspirationQuotes.length;
            quoteElement.textContent = inspirationQuotes[quoteIndex];
        }

        // Rotate quotes every 12 seconds (matching the animation duration)
        setInterval(rotateQuotes, 12000);
    </script>
</body>
</html>
